; PT2 firmware - ATmega328P-A, no crystal, internal 8MHz RC oscillator, 3.3V
;
; Two-step workflow:
;   1) One-time ISP flash of fuses + urboot bootloader (env:fuses_bootloader)
;   2) Regular application uploads over UART via the bootloader (env:upload_uart)
;
; Bootloader/fuse background: see bootloader/fuses.txt

[env]
platform = atmelavr
framework = arduino
board = ATmega328P
board_build.f_cpu = 8000000L
board_build.variant = standard
monitor_speed = 9600
;monitor_speed = 10227
build_flags =
    -Wall
    -Wextra

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0

; ---------------------------------------------------------------------------
; 初回のみ: ISPプログラマでヒューズ+urbootブートローダを書き込む
;   pio run -e fuses_bootloader -t fuses
;   pio run -e fuses_bootloader -t bootloader
; ---------------------------------------------------------------------------
[env:fuses_bootloader]
board_hardware.oscillator = internal
board_hardware.uart = uart0
board_hardware.bod = 2.7v
board_hardware.eesave = yes
board_bootloader.type = urboot
board_bootloader.speed = 38400
upload_protocol = avrispmkii
; USBaspを使う場合: upload_protocol = usbasp

; ---------------------------------------------------------------------------
; 通常運用: UART(FTDI)経由でアプリケーションを書き込む
;   pio run -e upload_uart -t upload
;   upload_port は環境に合わせて変更 (Windowsの場合 COMx)
; ---------------------------------------------------------------------------
[env:upload_uart]
board_bootloader.speed = 38400
upload_protocol = urclock
upload_speed = 38400
;upload_port = COM3
